<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copy Selected Tab URLs — Icon candidates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Noto+Sans+JP:wght@500;600;700&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        color: #172033;
        background: #edf3fb;
        font-family: "Noto Sans JP", sans-serif;
      }

      * { box-sizing: border-box; }

      body { margin: 0; }

      main {
        width: min(100% - 32px, 800px);
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #365da5;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(1.75rem, 6vw, 2.75rem); }

      .intro { max-width: 620px; margin: 16px 0 32px; line-height: 1.8; }

      fieldset {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(156px, 1fr));
        gap: 16px;
        margin: 0;
        padding: 0;
        border: 0;
      }

      legend { margin-bottom: 16px; font-weight: 700; }

      input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; }

      label {
        display: grid;
        min-height: 190px;
        padding: 20px;
        border: 2px solid #cfdae9;
        border-radius: 20px;
        background: #fff;
        cursor: pointer;
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      label:hover { transform: translateY(-3px); border-color: #537dca; }

      input:checked + label {
        border-color: #195bbc;
        box-shadow: 0 12px 24px rgb(25 91 188 / 20%);
      }

      input:focus-visible + label { outline: 4px solid #f7c948; outline-offset: 4px; }

      .material-symbols-rounded {
        align-self: start;
        color: #195bbc;
        font-size: 54px;
        font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48;
      }

      strong { align-self: end; font-size: 1.05rem; }
      code { color: #52627c; font-family: ui-monospace, monospace; font-size: 0.78rem; }

      .note {
        margin: 32px 0 0;
        padding: 16px 20px;
        border-left: 4px solid #195bbc;
        border-radius: 0 12px 12px 0;
        background: #dce9fb;
        line-height: 1.7;
      }

      @media (prefers-reduced-motion: reduce) {
        label { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Material Symbols</p>
      <h1>アイコン候補</h1>
      <p class="intro">選択したタブの URL をまとめてコピーする拡張機能向けです。カードを選ぶと、枠線で候補を比較できます。</p>

      <fieldset>
        <legend>メインアイコンとして比較</legend>
        <input id="content-copy" name="icon" type="radio">
        <label for="content-copy" data-icon="content_copy">
          <span class="material-symbols-rounded" aria-hidden="true">content_copy</span>
          <strong>コピー</strong>
          <code>content_copy</code>
        </label>

        <input id="copy-all" name="icon" type="radio" checked>
        <label for="copy-all" data-icon="copy_all">
          <span class="material-symbols-rounded" aria-hidden="true">copy_all</span>
          <strong>まとめてコピー</strong>
          <code>copy_all</code>
        </label>

        <input id="tab" name="icon" type="radio">
        <label for="tab" data-icon="tab">
          <span class="material-symbols-rounded" aria-hidden="true">tab</span>
          <strong>ブラウザタブ</strong>
          <code>tab</code>
        </label>

        <input id="link" name="icon" type="radio">
        <label for="link" data-icon="link">
          <span class="material-symbols-rounded" aria-hidden="true">link</span>
          <strong>URL・リンク</strong>
          <code>link</code>
        </label>
      </fieldset>

      <p class="note"><strong>おすすめ:</strong> 機能を一目で伝えるなら <code>copy_all</code>。拡張機能の対象（タブ）を強調するなら <code>tab</code> をメインにして、ポップアップのコピー操作には <code>content_copy</code> を使う組み合わせがよさそうです。</p>
    </main>
  </body>
</html>
